  <link rel="stylesheet" href="style.css">

  <div class="page-content">

    <div class="top-row">
       <select id="listSelect"></select>
       <button id="settingsBtn">Settings</button>
    </div>

    <input id="newItemInput" type="text" placeholder="Type then enter">

    <ul id="itemsList"></ul>

    <button id="undoBtn" class="undo-btn hidden">Undo</button>

    <dialog id="settingsDialog">

       <div id="listsManager"></div>

       <input id="newListName" type="text" placeholder="New list name">

       <button id="closeDialogBtn">Close</button>
    </dialog>
    </div>
