<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="lists.html">Lists</a>
    <a href="deadlines.html">Calendar</a>
    <a href="timer.html" class="active">Timer</a>
  </nav>

  <div class="page-content">
    <div class="top-row timer-top-row">
      <select id="timerMode">
        <option value="stopwatch">Stopwatch</option>
        <option value="countdown">Countdown</option>
      </select>

      <select id="timerCategory"></select>

      <button id="timerSavedBtn" type="button">Saved</button>
    </div>

    <div class="top-row">
      <button id="manageTimerCategoriesBtn" type="button">Categories</button>
    </div>

    <div id="countdownOptions">
      <label class="check-row">
        <input type="checkbox" id="pomodoroMode">
        Pomodoro mode
      </label>

      <div id="pomodoroSettings">
        <p class="timer-help">
          Every
          <input type="number" id="workMinutes" min="1" value="25">
          minutes, stop for
          <input type="number" id="breakMinutes" min="1" value="5">
          minutes
        </p>
      </div>

      <label for="countdownMinutes">Set timer for (minutes)</label>
      <input type="number" id="countdownMinutes" min="1" value="45">
    </div>

    <div class="timer-visual-wrap">
    <svg class="progress-ring" width="220" height="220" viewBox="0 0 220 220">
        <!-- Outer main timer ring -->
        <circle class="progress-ring-bg" cx="110" cy="110" r="90"></circle>
        <circle class="progress-ring-bar" id="progressRingBar" cx="110" cy="110" r="90"></circle>

        <!-- Inner break ring -->
        <circle class="break-ring-bg" cx="110" cy="110" r="70"></circle>
        <circle class="break-ring-bar" id="breakRingBar" cx="110" cy="110" r="70"></circle>
    </svg>

    <button id="timerDisplay" class="timer-display-btn" type="button">00:00:00</button>
    </div>

    <div id="breakTimerBox" class="break-timer-box hidden">
    Break time: <span id="breakTimerText">00:00</span>
    </div>

    <div id="breakTimerBox" class="break-timer-box hidden">
      Break time: <span id="breakTimerText">00:00</span>
    </div>

    <div class="dialog-buttons timer-buttons">
      <button id="startPauseTimerBtn" type="button">Start</button>
      <button id="resetTimerBtn" type="button">Reset</button>
      <button id="saveTimerBtn" type="button">Save</button>
    </div>
  </div>

  <dialog id="timerCategoriesDialog">
    <h2>Timer Categories</h2>

    <div id="timerCategoriesManager"></div>

    <div class="new-category-row">
      <input type="text" id="newTimerCategoryName" placeholder="New category name">
      <input type="color" id="newTimerCategoryColor" value="#ff0000">
    </div>

    <div class="dialog-buttons">
      <button id="addTimerCategoryBtn" type="button">Add Category</button>
      <button id="closeTimerCategoriesDialogBtn" type="button">Close</button>
    </div>
  </dialog>

  <dialog id="savedTimesDialog">
    <h2>Saved Times</h2>
    <div id="savedTimesList"></div>
    <div class="dialog-buttons">
      <button id="closeSavedTimesDialogBtn" type="button">Close</button>
    </div>
  </dialog>
</body>
</html>
